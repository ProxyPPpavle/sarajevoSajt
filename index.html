<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Best Camp | Professional Sports Training</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Oswald:wght@400;700;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #000;
      color: #fff;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      z-index: 9999;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    .font-oswald {
      font-family: 'Oswald', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111;
    }

    ::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 4px;
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .year-outline {
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.15);
      color: transparent;
      font-size: 8rem;
      line-height: 1;
      pointer-events: none;
      font-family: 'Oswald', sans-serif;
      font-weight: 800;
    }

    @keyframes float {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-8px) rotate(1deg);
      }

      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    .animate-logo {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes fadeInSmooth {
      from {
        opacity: 0;
        transform: scale(0.98);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-history-smooth {
      animation: fadeInSmooth 0.4s ease-out forwards;
    }

    .orange-glow {
      box-shadow: 0 0 40px rgba(249, 115, 22, 0.15);
    }

    .blur-texture {
      backdrop-filter: blur(12px);
      background: rgba(24, 24, 27, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes rollIn {
      from {
        transform: translateX(100%) rotate(180deg);
        opacity: 0;
      }

      to {
        transform: translateX(0) rotate(0deg);
        opacity: 1;
      }
    }

    .animate-logo-enter {
      animation: rollIn 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, float 6s ease-in-out 1.8s infinite;
    }

    .mobile-menu-blur {
      backdrop-filter: blur(16px);
      background: rgba(0, 0, 0, 0.85);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.5?external=react,react-dom",
    "@google/genai": "https://esm.sh/@google/genai@0.21.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, { threshold: 0.05 });

    function initReveal() {
      document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    }

    window.addEventListener('load', initReveal);
    const observerMutation = new MutationObserver(initReveal);
    observerMutation.observe(document.body, { childList: true, subtree: true });
  </script>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
